<style>.filter-toggle{display:none}@media(max-width:760px){.filter-toggle{display:block;margin:16px 0 8px}.filters:not(.expanded){display:none}}
:root{font:15px/1.5 system-ui,sans-serif;color:#243039;background:#f5f6f7}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button,a,input,select,textarea{outline-offset:3px}button{cursor:pointer;background:white;color:inherit;border:1px solid #bdc5ca;border-radius:7px;padding:8px 12px}button:hover{background:#edf0f2}button:disabled{cursor:default;opacity:.5}button.primary{background:#263d48;color:white;border-color:#263d48}a{color:inherit}input,select,textarea{border:1px solid #bdc5ca;border-radius:6px;padding:9px;background:white;max-width:100%}textarea{width:100%;min-height:150px;resize:vertical}h1{font-size:27px;line-height:1.3;margin:0}h2{font-size:19px}h3{font-size:16px;margin:0 0 7px}p{margin:8px 0}.muted{color:#66737b;font-size:13px}.tag{display:inline-block;border:1px solid #c7ced2;border-radius:5px;padding:2px 7px;font-size:12px}.overdue{color:#9b3030}.notice{padding:11px 15px;background:#e8ecef;border-bottom:1px solid #ccd3d7}.notice small{display:block}.shell{display:grid;grid-template-columns:235px minmax(0,1fr);min-height:calc(100vh - 62px)}aside{border-right:1px solid #d3d9dd;background:white;padding:22px 16px}aside strong{display:block;margin-bottom:20px}nav{display:grid;gap:5px}nav button{text-align:left;border:0}nav button.active{background:#e5ebee;font-weight:650}.context{border-top:1px solid #ddd;margin-top:22px;padding-top:16px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 25px;border-bottom:1px solid #d3d9dd;background:white}.header-actions{display:flex;align-items:center;gap:8px}.mobile-menu{display:none}main{padding:28px;max-width:1450px;margin:auto}.titlebar{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}.filters{display:flex;align-items:end;flex-wrap:wrap;gap:10px;padding:14px;background:white;border:1px solid #d7dde0;border-radius:9px;margin:18px 0}.filters label{display:grid;gap:4px;font-size:12px}.filters input[type=search]{min-width:240px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:15px}.card{padding:19px;background:white;border:1px solid #cdd5da;border-radius:10px;min-width:0}.card h3,.taskcard h3{overflow-wrap:anywhere}.card .description{min-height:40px;color:#697780;font-size:14px}.card .actions{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.column{background:#e9edf0;border:1px solid #d2d9dd;border-radius:9px;padding:13px;min-height:250px}.column h2{font-size:15px;margin:0 0 14px}.taskcard{width:100%;text-align:left;display:block;background:white;border:1px solid #c8d1d7;border-radius:8px;padding:14px;margin-bottom:10px}.taskcard p{font-size:13px}.tasklist{display:grid;gap:10px}.taskrow{display:grid;grid-template-columns:minmax(0,1fr) auto;text-align:left;gap:18px;padding:16px;background:white}.taskrow strong{overflow-wrap:anywhere}.status-tabs{display:none}.empty{padding:35px;text-align:center;background:white;border:1px dashed #adb9c0;border-radius:8px}.info{background:white;border:1px solid #d6dde1;border-radius:8px;padding:12px 16px}.info summary{cursor:pointer}.overlay{position:fixed;inset:0;background:#15252c70;z-index:5;display:flex;justify-content:flex-end}.panel{width:min(650px,100%);height:100%;overflow:auto;background:white;padding:24px;box-shadow:-5px 0 20px #17232a25}.panel h1{font-size:24px;overflow-wrap:anywhere}.panel-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;background:#f0f3f5;border-radius:8px;margin:19px 0}.meta small{display:block}.comment{padding:13px 0;border-bottom:1px solid #dde2e5}.comment p{white-space:pre-wrap;overflow-wrap:anywhere}.editor-label{display:block;font-size:13px;margin:10px 0 5px}.toolbar{padding:6px;border:1px dashed #b9c4ca;border-bottom:0;font-size:12px;color:#65747d}.form{display:grid;gap:13px}.form label{display:grid;gap:4px}.form .buttons{display:flex;justify-content:flex-end;gap:10px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;background:#233e48;color:white;border-radius:8px;z-index:10;max-width:90vw}.demo-control{font-size:12px;display:flex;align-items:center;gap:7px}.footer-note{margin-top:24px;color:#697780;font-size:12px}.backdrop-menu{display:none}.hidden{display:none!important}
@media(max-width:760px){.shell{display:block}aside{display:none;position:fixed;inset:0 auto 0 0;width:270px;z-index:4;overflow:auto}aside.open{display:block}.backdrop-menu.open{display:block;position:fixed;inset:0;background:#15252c70;z-index:3}.mobile-menu{display:inline-block}header{padding:10px 14px;flex-wrap:wrap}.header-actions{margin-left:auto}.demo-control{width:100%;justify-content:flex-end}main{padding:20px 14px}.titlebar{flex-wrap:wrap}h1{font-size:24px}.filters{gap:8px}.filters label{flex:1 1 130px}.filters label.search{flex-basis:100%}.filters input[type=search]{width:100%;min-width:0}.cards{grid-template-columns:1fr}.board{display:block}.column{display:none}.column.mobile-active{display:block}.status-tabs{display:flex;gap:5px;margin:14px 0}.status-tabs button{flex:1;padding:10px 4px;font-size:13px}.status-tabs button.active{background:#263d48;color:white}.taskrow{grid-template-columns:1fr;gap:8px}.panel{width:100%;padding:18px 16px;padding-bottom:max(20px,env(safe-area-inset-bottom))}.meta{grid-template-columns:1fr 1fr}.notice{font-size:13px}.panel-top{position:sticky;top:-18px;background:white;z-index:1;padding:10px 0}.card .description{min-height:0}}
</style></head>
<body>
<div class="notice"><strong>Wireframe tương tác — dữ liệu mẫu</strong><small>Chưa nối API • Không gửi email • Không lưu thay đổi sau reload • Màu/font chỉ tạm để review bố cục.</small></div>
<div id="menuBackdrop" class="backdrop-menu"></div>
<div class="shell"><aside id="sidebar"><strong>Workflow</strong><nav id="navigation"></nav><div class="context" id="workspaceNav"></div><p class="footer-note">Mẫu lõi: Home, Projects, Board, My Tasks, Task và Comments.<br>Auth/Settings/Notifications ở batch tiếp theo.</p></aside>
<div><header><button class="mobile-menu" id="menuButton" aria-label="Mở điều hướng" aria-expanded="false">☰ Menu</button><span id="breadcrumb">Trang chủ</span><div class="header-actions"><span class="tag">Minh · người dùng mẫu</span></div><label class="demo-control">Thử quyền Workspace <select id="role"><option value="owner">Owner</option><option value="member">Member</option></select></label></header><main id="content"></main></div></div>
<div id="overlay" class="overlay hidden"></div><div id="toast" role="status" class="toast hidden"></div>
<script>
'use strict';
const $=s=>document.querySelector(s), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names={me:'Minh',lan:'Lan',hung:'Hùng'}, statuses={todo:'Chưa làm',in_progress:'Đang làm',done:'Hoàn thành'};
const spaces=[{id:'w1',name:'Nhóm phát triển sản phẩm',description:'Cùng xây dựng nền tảng quản lý công việc. Thống nhất yêu cầu, kiểm API và review giao diện trong từng Project.',created:'2026-10-03'},{id:'w2',name:'Nhóm học tập',description:'Theo dõi bài tập và trao đổi kiến thức giữa các thành viên.',created:'2026-10-01'}];
const projects=[{id:'p1',wid:'w1',name:'Workflow Platform',description:'Thiết kế và phát triển hệ thống từ requirement đến giao diện.',state:'active',created:'2026-10-03'},{id:'p2',wid:'w1',name:'Nghiên cứu ban đầu',description:'Lưu kết quả phân tích giai đoạn đầu.',state:'archived',created:'2026-10-01'},{id:'p3',wid:'w2',name:'Bài tập nhóm',description:'Tổng hợp tiến độ học tập.',state:'active',created:'2026-10-02'}];
let tasks=[{id:'t1',pid:'p1',title:'Review bố cục Home và danh sách Workspace',description:'Kiểm tra luồng chọn Workspace và mở Project trên desktop/mobile. Chú ý tên dài và trạng thái chưa có dữ liệu.',status:'todo',assignee:'me',creator:'lan',due:'2026-10-05T16:30',created:'2026-10-03'},{id:'t2',pid:'p1',title:'Kiểm API Task khi hai người sửa đồng thời',description:'Lần lưu bản cũ phải trả conflict, giữ nội dung đang nhập và không tự ghi đè.',status:'in_progress',assignee:'lan',creator:'me',due:'2026-10-02T14:00',created:'2026-10-02'},{id:'t3',pid:'p1',title:'Rà soát quyền Assignee',description:'Assignee chỉ đổi status nếu không đồng thời là Owner hoặc Creator.',status:'done',assignee:'hung',creator:'lan',left:true,due:'2026-10-01T09:00',created:'2026-10-01'},{id:'t4',pid:'p1',title:'Chuẩn bị bộ nhãn Việt / English cho giao diện',description:'Giữ nguyên nội dung người dùng khi chuyển ngôn ngữ.',status:'todo',assignee:null,creator:'lan',due:null,created:'2026-09-30'},{id:'t5',pid:'p3',title:'Tổng hợp bài tập tuần này',description:'Tạo danh sách kết quả nhóm cần hoàn thành.',status:'in_progress',assignee:'me',creator:'lan',due:null,created:'2026-10-02'},{id:'t6',pid:'p2',title:'Đọc lại phân tích SRS',description:'Task trong Project Archived chỉ được đọc.',status:'todo',assignee:'me',creator:'me',due:'2026-10-01T18:00',created:'2026-09-29'}];
let comments=[{id:'c1',tid:'t1',author:'lan',text:'Cần kiểm cả trường hợp vừa đăng nhập và chưa có Workspace.',time:'03/10/2026 · 10:00'},{id:'c2',tid:'t1',author:'me',text:'Mình sẽ dùng cùng Task Detail cho Board và My Tasks.',time:'03/10/2026 · 10:20'}];
let background='home',mobileStatus='todo',toastTimer,lastFocus=null,draftDirty=false,currentView=null;
const viewCache=new Map();
const project=id=>projects.find(p=>p.id===id), space=id=>spaces.find(w=>w.id===id), task=id=>tasks.find(t=>t.id===id), role=()=>$('#role').value;
const day=d=>d?new Date(d.length===10?d+'T00:00:00+07:00':d+'+07:00').toLocaleString('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',...(d.length===10?{year:'numeric',month:'2-digit',day:'2-digit'}:{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}):'Không có hạn';
const overdue=t=>t.due&&t.status!=='done'&&t.due<'2026-10-03T12:00';
const canEdit=t=>project(t.pid).state==='active'&&(role()==='owner'||t.creator==='me');
const canStatus=t=>project(t.pid).state==='active'&&(canEdit(t)||t.assignee==='me');
function toast(text){$('#toast').textContent=text;$('#toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.add('hidden'),4000)}
function closeMenu(){$('#sidebar').classList.remove('open');$('#menuBackdrop').classList.remove('open');$('#menuButton').setAttribute('aria-expanded','false')}
function go(route){if(draftDirty&&!confirm('Bỏ nội dung chưa lưu trong mẫu?'))return;draftDirty=false;closeMenu();location.hash=route}
function route(){return decodeURIComponent(location.hash.slice(1))||'home'}
function context(r){if(r.startsWith('workspace:'))return space(r.split(':')[1]);if(r.startsWith('board:'))return space(project(r.split(':')[1])?.wid);if(r.startsWith('task:'))return space(project(task(r.split(':')[1])?.pid)?.wid);return null}
function nav(r){const w=context(r)||context(background);$('#navigation').innerHTML=`<button data-go="home" class="${r==='home'?'active':''}">Trang chủ</button><button data-go="mine" class="${r==='mine'?'active':''}">Công việc của tôi</button>`;$('#workspaceNav').innerHTML=w?`<p class="muted">Workspace hiện tại</p><strong>${esc(w.name)}</strong><button data-go="workspace:${w.id}">Dự án</button><p class="muted">Thành viên / Lời mời / Cài đặt: batch tiếp theo</p>`:'<p class="muted">Chọn Workspace ở Trang chủ để mở các dự án.</p>';$('#breadcrumb').textContent=w?`Trang chủ › ${w.name}`:'Khu vực cá nhân';document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go))}
function filters(type){return `<button class="filter-toggle" id="filterToggle" aria-expanded="false">Tìm kiếm và bộ lọc</button><div class="filters"><label class="search">Tìm ${type==='home'?'Workspace':type==='projects'?'Project':'Task'} theo tên hoặc mô tả<input id="search" type="search" placeholder="Nhập để tìm…"></label>${['board','mine'].includes(type)?'<label>Thời gian<select id="timeField"><option value="created">Ngày tạo</option><option value="due">Deadline</option></select></label>':''}<label>Từ ngày<input id="from" type="date"></label><label>Đến ngày<input id="to" type="date"></label>${type==='projects'?'<label>Project<select id="state"><option value="active">Active</option><option value="archived">Archived</option><option value="all">Tất cả</option></select></label>':''}${type==='mine'?'<label>Workspace<select id="wid"><option value="all">Tất cả</option>'+spaces.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')+'</select></label><label>Project<select id="state"><option value="active">Active</option><option value="archived">Archived</option><option value="all">Tất cả</option></select></label><label>Trạng thái<select id="status"><option value="open">Chưa hoàn thành</option><option value="all">Tất cả</option>'+Object.entries(statuses).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')+'</select></label>':''}${['board','mine'].includes(type)?'<label>Quá hạn<select id="late"><option value="all">Không giới hạn</option><option value="yes">Chỉ quá hạn</option></select></label>':''}<button id="reset">Về mặc định</button></div><p class="muted">Thứ tự: mới tạo trước • Bộ lọc trong mẫu chỉ chạy trên dữ liệu giả.</p><p id="filterError" class="overdue" role="status"></p>`}
const fold=v=>v.normalize('NFD').replace(/\p{M}/gu,'').replace(/đ/g,'d').toLowerCase();
function match(v){const q=fold($('#search')?.value||'').split(/\s+/).filter(Boolean),text=fold(v.title?v.title+' '+v.description:v.name+' '+v.description),f=$('#from')?.value,to=$('#to')?.value,d=$('#timeField')?.value==='due'?v.due?.slice(0,10):v.created;return q.every(x=>text.includes(x))&&(!f&&!to||!!d&&(!f||d>=f)&&(!to||d<=to))}
function bindFilters(draw){if($("#filterToggle"))$("#filterToggle").onclick=()=>{const expanded=$(".filters").classList.toggle("expanded");$("#filterToggle").setAttribute("aria-expanded",String(expanded))};document.querySelectorAll('.filters input,.filters select').forEach(e=>e.oninput=()=>{if($('#from').value&&$('#to').value&&$('#from').value>$('#to').value){$('#filterError').textContent='Ngày bắt đầu phải trước hoặc bằng ngày kết thúc. Bộ lọc chưa được áp dụng.';return}$('#filterError').textContent='';draw()});$('#reset').onclick=()=>{document.querySelectorAll('.filters input').forEach(e=>e.value='');document.querySelectorAll('.filters select').forEach(e=>e.selectedIndex=0);render()}}
const empty=text=>`<div class="empty"><strong>${text}</strong><p class="muted">Thử điều chỉnh điều kiện hoặc Về mặc định.</p></div>`;
const deadline=t=>`<span class="${overdue(t)?'overdue':''}">${overdue(t)?'Quá hạn · ':''}${day(t.due)}${t.due?' · giờ Việt Nam':''}</span>`;
function cardsBind(){document.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{lastFocus=b;background=route();go('task:'+b.dataset.task)})}
function render(){const r=route();nav(r);if(r.startsWith('task:')){if(!$('#content').children.length){background='board:'+(task(r.split(':')[1])?.pid||'p1');renderBackground(background)}openTask(r.split(':')[1]);return}$('#overlay').classList.add('hidden');renderBackground(r)}
function renderBackground(r){if(currentView){viewCache.set(currentView,{values:Object.fromEntries([...document.querySelectorAll('.filters input,.filters select')].map(e=>[e.id,e.value])),scroll:window.scrollY})}buildBackground(r);currentView=r;const saved=viewCache.get(r);if(saved){Object.entries(saved.values).forEach(([id,value])=>{const e=document.getElementById(id);if(e)e.value=value});$('#search')?.dispatchEvent(new Event('input'));window.scrollTo(0,saved.scroll)}}
function buildBackground(r){background=r;nav(r);const main=$('#content');if(r==='home'){main.innerHTML=`<div class="titlebar"><div><h1>Workspace của bạn</h1><p class="muted">Chọn nhóm để mở danh sách Project.</p></div><button class="primary" id="create">Tạo Workspace</button></div>${filters('home')}<div id="results" class="cards"></div>`;function draw(){const list=spaces.filter(match).sort((a,b)=>b.created.localeCompare(a.created));$('#results').innerHTML=list.length?list.map(w=>`<article class="card"><h3>${esc(w.name)}</h3><p class="description">${esc(w.description)}</p><div class="actions"><span class="tag">${role()==='owner'?'Owner':'Member'} · mẫu</span><button data-go="workspace:${w.id}">Mở Workspace</button></div></article>`).join(''):empty('Không có Workspace phù hợp');nav(r)}draw();bindFilters(draw);$('#create').onclick=()=>createForm('workspace');return}
if(r.startsWith('workspace:')){const w=space(r.split(':')[1]);if(!w){main.innerHTML=empty('Workspace không khả dụng');return}main.innerHTML=`<div class="titlebar"><div><h1>${esc(w.name)}</h1><p><span class="tag">${role()==='owner'?'Owner':'Member'}</span></p></div>${role()==='owner'?'<button class="primary" id="create">Tạo Project</button>':''}</div><details class="info"><summary>Thông tin Workspace</summary><p>${esc(w.description)}</p></details><h2>Dự án</h2>${filters('projects')}<div id="results" class="cards"></div>`;function draw(){const list=projects.filter(p=>p.wid===w.id&&match(p)&&($('#state').value==='all'||p.state===$('#state').value)).sort((a,b)=>b.created.localeCompare(a.created));$('#results').innerHTML=list.length?list.map(p=>`<article class="card"><h3>${esc(p.name)}</h3><p class="description">${esc(p.description)}</p><div class="actions"><span class="tag">${p.state==='active'?'Active':'Archived · chỉ đọc'}</span><button data-go="board:${p.id}">Mở Board</button></div></article>`).join(''):empty('Không có Project phù hợp');nav(r)}draw();bindFilters(draw);if($('#create'))$('#create').onclick=()=>createForm('project',w.id);return}
if(r.startsWith('board:')){const p=project(r.split(':')[1]);if(!p){main.innerHTML=empty('Project không khả dụng');return}main.innerHTML=`<div class="titlebar"><div><h1>${esc(p.name)}</h1><p><span class="tag">${p.state==='active'?'Active':'Archived · chỉ đọc'}</span></p></div>${p.state==='active'?'<button class="primary" id="create">Tạo Task</button>':''}</div>${p.state==='archived'?'<div class="info">Project đã lưu trữ. Task và Comments chỉ được đọc trong mẫu này.</div>':''}<details class="info"><summary>Thông tin Project</summary><p>${esc(p.description)}</p></details>${filters('board')}<div id="tabs" class="status-tabs"></div><div id="results" class="board"></div>`;function draw(){const all=tasks.filter(t=>t.pid===p.id&&match(t)&&($('#late').value!=='yes'||overdue(t))).sort((a,b)=>b.created.localeCompare(a.created));$('#tabs').innerHTML=Object.entries(statuses).map(([s,n])=>`<button data-status="${s}" class="${mobileStatus===s?'active':''}">${n} (${all.filter(t=>t.status===s).length})</button>`).join('');$('#results').innerHTML=Object.entries(statuses).map(([s,n])=>{const list=all.filter(t=>t.status===s);return `<section class="column ${mobileStatus===s?'mobile-active':''}"><h2>${n} (${list.length})</h2>${list.length?list.map(t=>`<button class="taskcard" data-task="${t.id}"><h3>${esc(t.title)}</h3><p>${esc(names[t.assignee]||'Chưa phân công')}${t.left?' · đã rời':''}</p><p>${deadline(t)}</p></button>`).join(''):'<p class="muted">Không có Task phù hợp.</p>'}</section>`}).join('');document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{mobileStatus=b.dataset.status;draw()});cardsBind()}draw();bindFilters(draw);if($('#create'))$('#create').onclick=()=>createForm('task',p.id);return}
if(r==='mine'){main.innerHTML=`<div class="titlebar"><div><h1>Công việc của tôi</h1><p class="muted">Các Task đang được giao cho Minh trong những nhóm hiện tại.</p></div></div>${filters('mine')}<p id="count" class="muted"></p><div id="results" class="tasklist"></div>`;function draw(){const list=tasks.filter(t=>{const p=project(t.pid),s=$('#status').value;return t.assignee==='me'&&match(t)&&($('#wid').value==='all'||p.wid===$('#wid').value)&&($('#state').value==='all'||p.state===$('#state').value)&&(s==='all'||s==='open'&&t.status!=='done'||s===t.status)&&($('#late').value!=='yes'||overdue(t))}).sort((a,b)=>b.created.localeCompare(a.created));$('#count').textContent=list.length+' kết quả trong dữ liệu mẫu';$('#results').innerHTML=list.length?list.map(t=>{const p=project(t.pid);return `<button class="taskrow" data-task="${t.id}"><div><strong>${esc(t.title)}</strong><p class="muted">${esc(space(p.wid).name)} → ${esc(p.name)}</p><small>Ngày tạo: ${day(t.created)}</small></div><div><span class="tag">${statuses[t.status]}</span>${p.state==='archived'?' <span class="tag">Archived</span>':''}<p>${deadline(t)}</p></div></button>`}).join(''):empty('Không có công việc phù hợp bộ lọc');cardsBind()}draw();bindFilters(draw);return}main.innerHTML=empty('Màn hình chưa có trong batch wireframe lõi')}
function openTask(id){const t=task(id);if(!t){$('#overlay').classList.add('hidden');$('#content').innerHTML=empty('Task không khả dụng');return}draftDirty=false;const p=project(t.pid),edit=canEdit(t),status=canStatus(t);$('#overlay').innerHTML=`<section class="panel" role="dialog" aria-modal="true" aria-labelledby="taskTitle"><div class="panel-top"><span class="muted">Chi tiết Task · dữ liệu mẫu</span><button id="close">Đóng</button></div><p class="muted">${esc(space(p.wid).name)} → ${esc(p.name)}</p>${p.state==='archived'?'<p class="info">Project Archived — chỉ đọc</p>':''}<h1 id="taskTitle">${esc(t.title)}</h1><label class="editor-label">Trạng thái <select id="taskStatus" ${status?'':'disabled'}>${Object.entries(statuses).map(([k,v])=>`<option value="${k}" ${t.status===k?'selected':''}>${v}</option>`).join('')}</select></label><div class="meta"><div><small>Người được giao</small>${esc(names[t.assignee]||'Chưa phân công')}${t.left?' · đã rời':''}</div><div><small>Deadline</small>${deadline(t)}</div><div><small>Người tạo</small>${esc(names[t.creator])}</div><div><small>Ngày tạo</small>${day(t.created)}</div></div><h2>Mô tả</h2><p style="white-space:pre-wrap">${esc(t.description)}</p>${edit?'<button id="edit">Sửa Task</button>':''}<p class="muted">${edit?'Owner/Creator được sửa; status là thao tác riêng.':status?'Assignee chỉ được đổi status.':'Task chỉ đọc với quyền đang chọn.'}</p><h2>Bình luận</h2><div id="comments"></div>${p.state==='active'?'<label class="editor-label" for="commentText">Viết bình luận</label><div class="toolbar">Vùng editor chung — toolbar rich text sẽ dựng ở batch components</div><textarea id="commentText" placeholder="Nhập nội dung mẫu…" maxlength="5000"></textarea><p class="muted">Mẫu hiện dùng text thuần; chưa kiểm schema/Unicode count BE.</p><button id="send" class="primary">Gửi bình luận mẫu</button>':''}</section>`;$('#overlay').classList.remove('hidden');$('#close').onclick=()=>go(background);$('#taskStatus').onchange=e=>{t.status=e.target.value;if(t.left&&t.status!=='done'){t.assignee=null;t.left=false}renderBackground(background);openTask(id);toast('Đã đổi status trong mẫu; danh sách được cập nhật theo bộ lọc.')};if($('#edit'))$('#edit').onclick=()=>editTask(t);drawComments(t);if($('#send')){$('#commentText').oninput=()=>draftDirty=!!$('#commentText').value;$('#send').onclick=()=>{const text=$('#commentText').value.trim();if(!text){toast('Nhập nội dung bình luận.');return}comments.push({id:'c'+Date.now(),tid:id,author:'me',text,time:'Vừa tạo · mẫu'});draftDirty=false;$('#commentText').value='';drawComments(t);toast('Đã thêm bình luận trong mẫu.')}}$('#close').focus()}
function drawComments(t){const list=comments.filter(c=>c.tid===t.id).reverse();$('#comments').innerHTML=list.length?list.map(c=>`<article class="comment"><strong>${esc(names[c.author])}</strong> <small class="muted">${esc(c.time)}</small><p>${esc(c.text)}</p>${c.author==='me'&&project(t.pid).state==='active'?`<button data-delete-comment="${c.id}">Xóa bình luận của tôi</button>`:''}</article>`).join(''):'<p class="muted">Chưa có bình luận.</p>';document.querySelectorAll('[data-delete-comment]').forEach(b=>b.onclick=()=>{if(confirm('Xóa bình luận của bạn trong mẫu?')){comments=comments.filter(c=>c.id!==b.dataset.deleteComment);drawComments(t)}})}
function editTask(t){if(draftDirty&&!confirm('Bỏ bình luận chưa gửi để sửa Task?'))return;draftDirty=false;const panel=$('.panel');panel.innerHTML=`<div class="panel-top"><h2>Sửa Task · mẫu</h2><button id="cancelEdit">Hủy</button></div><form id="editForm" class="form"><label>Title<input name="title" value="${esc(t.title)}" maxlength="300" required></label><label>Mô tả<textarea name="description">${esc(t.description)}</textarea></label><label>Người được giao<select name="assignee"><option value="">Chưa phân công</option>${Object.entries(names).filter(([k])=>k!=='hung').map(([k,n])=>`<option value="${k}" ${t.assignee===k?'selected':''}>${n}</option>`).join('')}${t.left?'<option value="keep" selected>Giữ người đã rời khi không đổi phân công</option>':''}</select></label><label>Deadline · giờ Việt Nam<input name="due" type="datetime-local" step="60" value="${esc(t.due||'')}"></label><p class="muted">Lưu mẫu chưa có request/version/conflict thật. Hạn quá khứ được phép.</p><button class="primary">Lưu trong mẫu</button></form>`;$('#editForm').oninput=()=>draftDirty=true;$('#cancelEdit').onclick=()=>{if(!draftDirty||confirm('Bỏ thay đổi chưa lưu?'))openTask(t.id)};$('#editForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);t.title=String(f.get('title')).trim();t.description=String(f.get('description'));if(f.get('assignee')!=='keep'){t.assignee=f.get('assignee')||null;t.left=false}t.due=f.get('due')||null;draftDirty=false;renderBackground(background);openTask(t.id);toast('Đã lưu Task trong mẫu.')}}
function createForm(type,parent){lastFocus=document.activeElement;draftDirty=false;const title={workspace:'Workspace',project:'Project',task:'Task'}[type];$('#overlay').innerHTML=`<section class="panel" role="dialog" aria-modal="true" aria-labelledby="createTitle"><div class="panel-top"><h2 id="createTitle">Tạo ${title} · mẫu</h2><button id="cancelCreate">Hủy</button></div><form id="createForm" class="form"><label>${type==='task'?'Title':'Tên'}<input name="name" required maxlength="${type==='task'?300:200}"></label><label>Mô tả<textarea name="description"></textarea></label><p class="muted">Wireframe form dùng text thuần, không tạo dữ liệu hệ thống thật.</p><button class="primary">Tạo trong mẫu</button></form></section>`;$('#overlay').classList.remove('hidden');const close=()=>{if(draftDirty&&!confirm('Bỏ nội dung chưa lưu?'))return;draftDirty=false;$('#overlay').classList.add('hidden');lastFocus?.focus()};$('#cancelCreate').onclick=close;$('#createForm').oninput=()=>draftDirty=true;$('#createForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),name=String(f.get('name')).trim(),description=String(f.get('description')),id=type[0]+Date.now();if(!name)return;if(type==='workspace'){spaces.unshift({id,name,description,created:'2026-10-03'});draftDirty=false;go('workspace:'+id)}else if(type==='project'){projects.unshift({id,wid:parent,name,description,state:'active',created:'2026-10-03'});draftDirty=false;go('board:'+id)}else{tasks.unshift({id,pid:parent,title:name,description,status:'todo',assignee:null,creator:'me',due:null,created:'2026-10-03'});draftDirty=false;go('task:'+id)}$('#overlay').classList.add('hidden');render();toast('Đã tạo '+title+' trong mẫu.')};$('#createForm input').focus()}
$('#menuButton').onclick=()=>{$('#sidebar').classList.toggle('open');$('#menuBackdrop').classList.toggle('open');$('#menuButton').setAttribute('aria-expanded',String($('#sidebar').classList.contains('open')))};$('#menuBackdrop').onclick=closeMenu;$('#role').onchange=()=>{if(draftDirty){toast('Lưu hoặc hủy bản nháp trước khi đổi quyền trong mẫu.');$('#role').value=$('#role').value==='owner'?'member':'owner';return}render()};window.onhashchange=render;document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!$('#overlay').classList.contains('hidden')){const cancel=$('#cancelCreate')||$('#cancelEdit')||$('#close');cancel?.click()}else closeMenu()}if(e.key==='Tab'&&!$('#overlay').classList.contains('hidden')){const focus=[...$('#overlay').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled),first=focus[0],last=focus.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});window.addEventListener('beforeunload',e=>{if(draftDirty){e.preventDefault();e.returnValue=''}});render();
</script></body></html>
